[graph]
all-features = true
# Must match `targets` in dist-workspace.toml.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"
# Merged into zbus 6.0. Remove once secret-service depends on zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6, no release of secret-service on zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6, no release of secret-service on zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6, no release of secret-service on zbus 6" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
