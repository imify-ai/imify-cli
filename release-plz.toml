[workspace]
# dist builds the binaries and creates the GitHub Release from the tag.
git_release_enable = false
# Off until the crate names are published for the first time.
publish = false
semver_check = true
pr_labels = ["release"]

[[package]]
name = "imify"
git_tag_enable = false

[[package]]
name = "imify-cli"
git_tag_name = "v{{ version }}"
