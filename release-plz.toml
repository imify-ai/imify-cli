[workspace]
# dist builds the binaries and creates the GitHub Release from the tag.
git_release_enable = false
# Off until the crate names are published for the first time.
publish = false
semver_check = true
pr_labels = ["release"]
# The release PR body passes scripts/policy/check-message.sh: no emoji, no attribution footer.
pr_body = """
## Release
{% for release in releases %}
- `{{ release.package }}`: {% if release.previous_version and release.previous_version != release.next_version %}{{ release.previous_version }} -> {% endif %}{{ release.next_version }}{% if release.semver_check == "incompatible" %} (breaking API changes){% elif release.semver_check == "compatible" %} (compatible API changes){% endif %}
{%- endfor %}
{%- for release in releases %}{% if release.breaking_changes %}

### `{{ release.package }}` breaking changes

```text
{{ release.breaking_changes }}
```{% endif %}{% endfor %}
{%- for release in releases %}{% if release.changelog %}

## `{{ release.package }}` changelog
{% if release.title %}
{{ release.title }}
{% endif %}
{{ release.changelog }}{% endif %}{% endfor %}
"""

[changelog]
# The release-plz default body, except that `imify` has no release link: it is not tagged.
body = '''

## [{{ version }}]{%- if release_link and package != "imify" -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}
{%- if commit.scope -%}
- *({{commit.scope}})* {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}{%- if commit.links %} ({% for link in commit.links %}[{{link.text}}]({{link.href}}) {% endfor -%}){% endif %}
{% else -%}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% endif -%}
{% endfor -%}
{% endfor %}'''

[[package]]
name = "imify"
git_tag_enable = false

[[package]]
name = "imify-cli"
git_tag_name = "v{{ version }}"
