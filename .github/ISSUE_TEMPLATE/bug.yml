name: Bug report
description: A command behaves differently than documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `imify --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.4 arm64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command. Remove tokens and other secrets.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Output with `--json -vv`, if possible.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
