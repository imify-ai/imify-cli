[package]
name = "imify"
version = "0.0.0"
description = "Rust SDK for the imify platform API"
readme = "README.md"
keywords = ["imify", "robotics", "datasets", "lerobot", "sdk"]
categories = ["api-bindings", "science::robotics"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.23.1"
fastrand = "2.3"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
getrandom = "0.4.3"
httpdate = "1.0.3"
parquet = { version = "60", default-features = false, features = ["snap"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
rustix = { version = "1.1.2", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7.15", features = ["io"] }

[dev-dependencies]
imify-test-support = { path = "../imify-test-support" }
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6.5"

[lints]
workspace = true
