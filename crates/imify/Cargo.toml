[package]
name = "imify"
version = "0.0.0"
description = "Rust SDK for the imify platform API"
readme = "README.md"
keywords = ["imify", "robotics", "datasets", "lerobot", "sdk"]
categories = ["api-bindings", "science::robotics"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
fastrand = "2.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

[lints]
workspace = true
