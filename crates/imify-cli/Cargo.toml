[package]
name = "imify-cli"
version = "0.0.0"
description = "Command-line interface for the imify platform"
readme = "../../README.md"
keywords = ["imify", "robotics", "datasets", "lerobot", "cli"]
categories = ["command-line-utilities", "science::robotics"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "imify"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
imify = { path = "../imify", version = "0.0.0" }

[dev-dependencies]
assert_cmd = "2"

[lints]
workspace = true
